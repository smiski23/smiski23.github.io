<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>伝書鳩の盤 Pigeon Orders</title>
<style>
  :root{--bg:#f7f3ea;--fg:#1f1b16;--muted:#6b6257;--line:#d9cfbd;--accent:#2f5fb3;--card:#fffdf8}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141a31;--fg:#ece6da;--muted:#a9a6b8;--line:#33457a;--accent:#f3b541;--card:#1c2340}}
  :root[data-theme="dark"]{--bg:#141a31;--fg:#ece6da;--muted:#a9a6b8;--line:#33457a;--accent:#f3b541;--card:#1c2340}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","PingFang SC","PingFang TC","Apple SD Gothic Neo",system-ui,sans-serif;line-height:1.8;font-size:16px}
  main{max-width:760px;margin:0 auto;padding:32px 16px 64px}
  h1{font-size:1.6rem;line-height:1.4;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 24px;font-size:.95rem}
  nav{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 24px}
  section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 20px 12px;margin:0 0 24px}
  h2{font-size:1.25rem;margin:0 0 8px;border-bottom:2px solid var(--accent);padding-bottom:6px}
  h3{font-size:1.02rem;margin:20px 0 4px}
  p,li{overflow-wrap:anywhere}
  p{margin:0 0 12px}
  ul{margin:0 0 12px;padding-left:1.3em}
  .date,.note{color:var(--muted)}
  .note{font-size:.9rem}
  a{color:var(--accent)}
  footer{color:var(--muted);font-size:.85rem;text-align:center}
  img.icon{width:96px;height:96px;border-radius:22px;display:block;margin:0 0 12px}
</style>
</head>
<body>
<main>
  <img class="icon" src="icon.png" alt="伝書鳩の盤">
  <h1>伝書鳩の盤</h1>
  <p class="sub">Pigeon Orders — 命令は、2ターン後に届く。 / Your orders land two turns later.</p>
  <section>
    <p>7×7 の盤で読み合う1対1のボードゲーム（iPhone）。CPU 12人、今日の挑戦、オンライン対戦。</p>
    <p>A 1-on-1 board game of prediction for iPhone. 12 CPU rivals, daily challenge and online duels.</p>
    <p><a href="support.html">サポート / Support</a> ・ <a href="privacy.html">プライバシーポリシー / Privacy Policy</a></p>
  </section>
  <footer>© 2026 Smidem</footer>
</main>
</body>
</html>
